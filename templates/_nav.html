<header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="/">GoldDecor</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center" style="gap: 8px;">
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <span class="navbar-text">{{ user.username }}</span>
                        </li>
                        <li class="nav-item">
                            <form method="post" action="/logout/" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-outline-secondary btn-sm">Выйти</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="/login/">Войти</a></li>
                        <li class="nav-item"><a class="nav-link" href="/signup/">Регистрация</a></li>
                    {% endif %}
                    <li class="nav-item">
                        <a class="btn btn-primary btn-sm" href="/cart/">Корзина{% if cart_item_count %} ({{ cart_item_count }}){% endif %}</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
